<div class="campo" [class.campo--error]="error">
  @if (etiqueta) {
    <label class="campo__etiqueta" for="campo-{{ tipo }}-{{ etiqueta }}">
      {{ etiqueta }}
      @if (requerido) {
        <span class="campo__requerido" aria-hidden="true">*</span>
      }
    </label>
  }
  <input
    [type]="tipo"
    [value]="valor"
    [placeholder]="placeholder"
    [disabled]="deshabilitado"
    [autocomplete]="autocomplete"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
    class="campo__input"
  />
  @if (error) {
    <span class="campo__error">{{ error }}</span>
  } @else if (ayuda) {
    <span class="campo__ayuda">{{ ayuda }}</span>
  }
</div>
