<div class="campo" [class.campo--error]="error">
  @if (etiqueta) {
    <label class="campo__etiqueta">
      {{ etiqueta }}
      @if (requerido) { <span class="campo__requerido">*</span> }
    </label>
  }
  <textarea
    class="campo__textarea"
    [rows]="filas"
    [placeholder]="placeholder"
    [disabled]="deshabilitado"
    [value]="valor"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
  ></textarea>
  @if (error) {
    <span class="campo__error">{{ error }}</span>
  } @else if (ayuda) {
    <span class="campo__ayuda">{{ ayuda }}</span>
  }
</div>
