<section class="explorar">
  <div class="explorar__contenedor">
    <header class="explorar__cabecera">
      <h1 class="explorar__titulo">Explorar ofertas</h1>
      <p class="explorar__subtitulo">
        {{ propuestasFiltradas().length }} ofertas disponibles
      </p>
    </header>

    <div class="explorar__filtros">
      <div class="explorar__buscador">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          placeholder="Buscar cargo, empresa, ciudad..."
          [value]="busqueda()"
          (input)="busqueda.set($any($event.target).value)"
        />
      </div>

      <div class="explorar__tabs">
        <button
          class="tab"
          [class.tab--activo]="filtroTipo() === 'TODOS'"
          (click)="setTipo('TODOS')"
        >
          Todo
        </button>
        <button
          class="tab"
          [class.tab--activo]="filtroTipo() === 'TRABAJO'"
          (click)="setTipo('TRABAJO')"
        >
          Trabajos
        </button>
        <button
          class="tab"
          [class.tab--activo]="filtroTipo() === 'PRACTICA'"
          (click)="setTipo('PRACTICA')"
        >
          Prácticas
        </button>
      </div>

      <select
        class="explorar__select"
        [value]="filtroModalidad()"
        (change)="filtroModalidad.set($any($event.target).value)"
      >
        <option value="">Todas las modalidades</option>
        <option value="PRESENCIAL">Presencial</option>
        <option value="REMOTO">Remoto</option>
        <option value="HIBRIDO">Híbrido</option>
      </select>
    </div>

    @if (cargando()) {
      <app-spinner mensaje="Cargando ofertas..." />
    } @else if (propuestasFiltradas().length === 0) {
      <app-empty-state
        titulo="Sin ofertas"
        mensaje="No encontramos ofertas que coincidan con tu búsqueda."
      />
    } @else {
      <div class="explorar__grid">
        @for (propuesta of propuestasFiltradas(); track propuesta.id_propuesta) {
          <app-propuesta-card
            [propuesta]="propuesta"
            [empresaNombre]="nombreEmpresa(propuesta.empresa_id)"
            [empresaFotografia]="fotoEmpresa(propuesta.empresa_id)"
            [empresaVerificada]="verifEmpresa(propuesta.empresa_id)"
            [esFavorito]="esFavorito(propuesta.id_propuesta)"
            (toggleFavorito)="onToggleFavorito($event)"
          />
        }
      </div>
    }
  </div>
</section>
