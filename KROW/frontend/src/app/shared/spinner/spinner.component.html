<div
  class="spinner-contenedor"
  role="status"
  [attr.aria-label]="mensaje || 'Cargando'"
>
  <span
    class="spinner"
    aria-hidden="true"
    [style.width.px]="tamanio"
    [style.height.px]="tamanio"
  ></span>
  @if (mensaje) {
    <p class="spinner__mensaje">{{ mensaje }}</p>
  }
</div>
