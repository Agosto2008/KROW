<button
  [type]="tipo"
  [disabled]="disabled || cargando"
  [class]="'btn btn--' + variante + ' btn--' + tamanio"
  [class.btn--bloque]="bloque"
  [class.btn--cargando]="cargando"
  (click)="onClick($event)"
>
  @if (cargando) {
    <span class="btn__spinner" aria-hidden="true"></span>
  }
  <span class="btn__contenido">
    <ng-content />
  </span>
</button>
