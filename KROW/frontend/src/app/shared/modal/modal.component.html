@if (abierto) {
  <div class="modal-fondo" (click)="onFondoClick()">
    <div
      [class]="'modal modal--' + ancho"
      (click)="onContenidoClick($event)"
      role="dialog"
      aria-modal="true"
    >
      <header class="modal__cabecera">
        <h3 class="modal__titulo">{{ titulo }}</h3>
        <button class="modal__cerrar" (click)="cerrar.emit()" aria-label="Cerrar">×</button>
      </header>
      <div class="modal__cuerpo">
        <ng-content />
      </div>
      <footer class="modal__pie">
        <ng-content select="[modalFooter]" />
      </footer>
    </div>
  </div>
}
