<div class="toast-contenedor" role="status" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div [class]="'toast toast--' + toast.tipo" (click)="toastService.cerrar(toast.id)">
      <span class="toast__mensaje">{{ toast.mensaje }}</span>
      <button class="toast__cerrar" aria-label="Cerrar">×</button>
    </div>
  }
</div>
